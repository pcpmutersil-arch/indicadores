<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MUTERSIL — Produção</title>


  <style>

    :root {

      --bg: #06101c;
      --bg2: #0c1d31;
      --card: #10253c;
      --card2: #0b1b2d;

      --text: #f1f7fd;
      --muted: #9fb3c8;

      --blue: #1498ff;
      --cyan: #10d8e8;
      --green: #24d68f;
      --yellow: #ffd052;
      --orange: #ff9f43;
      --red: #ff4357;

      --border:
        rgba(255,255,255,.10);

    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      overflow: hidden;

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color:
        var(--text);

      background:

        radial-gradient(
          circle at 90% 0%,
          #17497c 0%,
          #0a1c30 32%,
          #050b13 75%
        );

    }


    #app {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

    }


    /* ============================================================
       TELAS
       ============================================================ */

    .screen {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      padding:
        20px
        32px
        55px;

      opacity: 0;

      pointer-events: none;

      transform:
        translateX(35px);

      transition:
        opacity .45s ease,
        transform .45s ease;

    }


    .screen.active {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateX(0);

    }


    /* ============================================================
       HEADER
       ============================================================ */

    .header {

      height: 100px;

      display: grid;

      grid-template-columns:
        180px
        1fr
        270px;

      gap: 16px;

      align-items: center;

      margin-bottom: 15px;

    }


    .logo {

      max-width: 165px;

      max-height: 85px;

      object-fit: contain;

      background: white;

      padding: 4px;

    }


    .title-area {

      text-align: center;

    }


    .title {

      font-size:
        clamp(
          30px,
          2.6vw,
          52px
        );

      font-weight: 900;

      letter-spacing: .4px;

      line-height: 1;

    }


    .subtitle {

      margin-top: 9px;

      color:
        var(--muted);

      font-size:
        clamp(
          15px,
          1.05vw,
          21px
        );

      font-weight: 700;

    }


    .header-right {

      display: flex;

      flex-direction: column;

      align-items: flex-end;

      gap: 7px;

    }


    .connection {

      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 16px;

      font-weight: 900;

    }


    .connection-dot {

      width: 11px;
      height: 11px;

      border-radius: 50%;

    }


    .connection.online {

      color:
        var(--green);

    }


    .connection.online
    .connection-dot {

      background:
        var(--green);

      box-shadow:
        0 0 14px
        var(--green);

    }


    .connection.reconnecting {

      color:
        var(--yellow);

    }


    .connection.reconnecting
    .connection-dot {

      background:
        var(--yellow);

      box-shadow:
        0 0 14px
        var(--yellow);

    }


    .connection.offline {

      color:
        var(--red);

    }


    .connection.offline
    .connection-dot {

      background:
        var(--red);

      box-shadow:
        0 0 14px
        var(--red);

    }


    .updated {

      color:
        var(--muted);

      font-size: 13px;

      font-weight: 700;

      text-align: right;

    }


    /* ============================================================
       AVISOS
       ============================================================ */

    #notice {

      display: none;

      position: fixed;

      top: 10px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 5000;

      max-width: 780px;

      padding:
        10px
        20px;

      border-radius: 12px;

      color: #111;

      background:
        var(--yellow);

      font-size: 15px;

      font-weight: 900;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    }


    #notice.error {

      color: white;

      background:
        var(--red);

    }


    /* ============================================================
       CARDS
       ============================================================ */

    .card {

      background:

        linear-gradient(
          145deg,
          rgba(20,43,70,.96),
          rgba(8,22,38,.97)
        );

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.28);

    }


    /* ============================================================
       PRODUÇÃO AGORA
       ============================================================ */

    .overview {

      height:
        calc(
          100vh -
          180px
        );

      padding:
        15px
        18px;

    }


    .overview-table {

      width: 100%;
      height: 100%;

      border-collapse: collapse;

      table-layout: fixed;

    }


    .overview-table th {

      color:
        var(--muted);

      font-size:
        clamp(
          14px,
          1vw,
          19px
        );

      text-transform: uppercase;

      padding: 10px;

      text-align: center;

      border-bottom:
        2px solid
        rgba(255,255,255,.09);

    }


    .overview-table td {

      padding:
        11px
        12px;

      text-align: center;

      border-bottom:
        1px solid
        rgba(255,255,255,.07);

      font-size:
        clamp(
          19px,
          1.4vw,
          29px
        );

      font-weight: 800;

    }


    .overview-table .name {

      text-align: left;

      font-size:
        clamp(
          20px,
          1.55vw,
          32px
        );

      font-weight: 900;

    }


    .production-value {

      font-size: 1.35em;

      font-weight: 950;

    }


    .unit {

      display: block;

      margin-top: 3px;

      font-size: 11px;

      color:
        var(--muted);

    }


    .status-pill {

      display: inline-flex;

      min-width: 130px;

      justify-content: center;

      align-items: center;

      padding:
        9px
        14px;

      border-radius: 999px;

      font-size: 16px;

      font-weight: 900;

    }


    .status-ok {

      color: #06170f;

      background:
        var(--green);

    }


    .status-alert {

      color: white;

      background:
        var(--red);

    }


    .status-none {

      color: #d7e0e9;

      background: #52647a;

    }


    .good {

      color:
        var(--green);

    }


    .bad {

      color:
        var(--red);

    }


    /* ============================================================
       INDICADORES
       ============================================================ */

    .machine-grid {

      height:
        calc(
          100vh -
          180px
        );

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: 15px;

    }


    .machine-grid.single {

      grid-template-columns: 1fr;

    }


    .machine {

      padding:
        19px
        20px;

      overflow: hidden;

    }


    .machine-title {

      text-align: center;

      font-size:
        clamp(
          25px,
          1.8vw,
          37px
        );

      font-weight: 950;

      margin-bottom: 17px;

    }


    .labels,
    .turn-top {

      display: grid;

      grid-template-columns:
        1.2fr
        1fr
        1fr
        1fr;

      gap: 9px;

      align-items: center;

    }


    .labels {

      color:
        var(--muted);

      font-size: 11px;

      font-weight: 900;

      text-transform: uppercase;

      margin-bottom: 3px;

    }


    .labels div:not(:first-child) {

      text-align: center;

    }


    .turn {

      padding:
        14px 0;

      border-top:
        1px solid
        rgba(255,255,255,.08);

    }


    .turn-name {

      font-size:
        clamp(
          16px,
          1.15vw,
          23px
        );

      font-weight: 900;

    }


    .turn-value {

      text-align: center;

      font-size:
        clamp(
          17px,
          1.15vw,
          23px
        );

      font-weight: 900;

    }


    .progress {

      margin-top: 9px;

      width: 100%;
      height: 13px;

      background:
        rgba(255,255,255,.08);

      border-radius: 999px;

      overflow: hidden;

    }


    .progress-fill {

      height: 100%;

      border-radius: inherit;

      background:

        linear-gradient(
          90deg,
          var(--blue),
          var(--cyan)
        );

      transition:
        width .6s ease;

    }


    .machine-footer {

      display: flex;

      justify-content:
        space-between;

      margin-top: 18px;

      padding-top: 12px;

      border-top:
        1px solid
        rgba(255,255,255,.08);

      color:
        var(--muted);

      font-size: 14px;

      font-weight: 800;

    }


    /* ============================================================
       ÚLTIMOS APONTAMENTOS
       ============================================================ */

    .recent-card {

      height:
        calc(
          100vh -
          180px
        );

      padding:
        8px
        14px
        12px;

    }


    .recent-wrap {

      height:
        calc(
          100% -
          34px
        );

      overflow: hidden;

    }


    .recent-table {

      width: 100%;

      border-collapse: separate;

      border-spacing:
        0 5px;

      table-layout: fixed;

    }


    .recent-table th {

      padding: 7px;

      color:
        var(--muted);

      text-transform: uppercase;

      font-size:
        clamp(
          12px,
          .85vw,
          16px
        );

      text-align: left;

    }


    .recent-table td {

      padding:
        8px
        7px;

      background:
        rgba(255,255,255,.045);

      border-top:
        1px solid
        rgba(255,255,255,.055);

      border-bottom:
        1px solid
        rgba(255,255,255,.055);

      font-size:
        clamp(
          13px,
          .98vw,
          19px
        );

      font-weight: 700;

      line-height: 1.13;

    }


    .recent-table tr.alert td {

      color: white;

      background:

        linear-gradient(
          90deg,
          rgba(236,42,66,.94),
          rgba(189,25,50,.94)
        );

    }


    .obs {

      white-space: normal;

      overflow-wrap: anywhere;

    }


    .empty {

      height: 100%;

      display: grid;

      place-items: center;

      text-align: center;

      color:
        var(--muted);

      font-size:
        clamp(
          24px,
          2vw,
          40px
        );

      font-weight: 900;

    }


    .attention {

      height: 30px;

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        var(--muted);

      font-size: 14px;

      font-weight: 900;

    }


    /* ============================================================
       RODAPÉ
       ============================================================ */

    #footer {

      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      z-index: 500;

      height: 42px;

      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: center;

      padding:
        0 28px;

      color:
        var(--muted);

      background:
        rgba(2,8,15,.92);

      border-top:
        1px solid
        rgba(255,255,255,.08);

    }


    #timer {

      text-align: right;

      font-size: 13px;

      font-weight: 800;

    }


    #screen-name {

      font-size: 13px;

      font-weight: 800;

    }


    #dots {

      display: flex;

      gap: 8px;

    }


    .dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.23);

    }


    .dot.active {

      width: 25px;

      border-radius: 999px;

      background:
        var(--cyan);

      box-shadow:
        0 0 12px
        rgba(16,216,232,.5);

    }


    /* ============================================================
       LOADING
       ============================================================ */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 2000;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      gap: 20px;

      background:

        radial-gradient(
          circle,
          #123b64,
          #050b13 65%
        );

      transition:
        opacity .5s ease;

    }


    #loading.hidden {

      opacity: 0;

      pointer-events: none;

    }


    .spinner {

      width: 65px;
      height: 65px;

      border:
        6px solid
        rgba(255,255,255,.12);

      border-top-color:
        var(--cyan);

      border-radius: 50%;

      animation:
        girar
        .9s
        linear
        infinite;

    }


    @keyframes girar {

      to {

        transform:
          rotate(360deg);

      }

    }

  </style>

</head>


<body>


  <div id="app"></div>


  <div id="notice"></div>


  <div id="loading">

    <div class="spinner"></div>

    <div
      style="
        font-size:28px;
        font-weight:950;
      "
    >
      MUTERSIL
    </div>

    <div>
      Carregando produção...
    </div>

  </div>


  <footer id="footer">

    <div id="screen-name">
      Inicializando
    </div>

    <div id="dots"></div>

    <div id="timer">
      —
    </div>

  </footer>


  <script>

    /**
     * ============================================================
     * API ATUAL
     * ============================================================
     */
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwNEDgcyi8T44gAfv63h4iwxh1AsxzHrSAQXMB4B7QhJd0_0a0Ag5cyqOmNF_K7YkElbQ/exec';


    const LOGO_URL =
      'https://drive.google.com/thumbnail?id=1cVRA4xRIeOICfUG0FkOzuhwI2YVYOdII&sz=w500';


    /**
     * Troca visual:
     * 30 segundos.
     */
    const SCREEN_INTERVAL =
      30000;


    /**
     * CORRIGIDO:
     *
     * Atualização de dados:
     * 60 segundos.
     */
    const DATA_INTERVAL =
      60000;


    /**
     * Tempo máximo de cada tentativa.
     */
    const REQUEST_TIMEOUT =
      25000;


    /**
     * Repetições após falha.
     */
    const RETRY_DELAYS = [

      3000,

      8000,

      15000

    ];


    /**
     * Só consideramos realmente offline
     * após 5 minutos sem atualização válida.
     */
    const OFFLINE_AFTER =
      5 *
      60 *
      1000;


    const STORAGE_KEY =
      'MUTERSIL_DASHBOARD_LAST_GOOD_V3';


    const SCREENS = [

      {
        id: 'producao-agora',
        name: 'Produção Agora'
      },

      {
        id: 'indicador-potes',
        name: 'Indicador Potes'
      },

      {
        id: 'ultimos-potes',
        name: 'Últimos Apontamentos — Potes'
      },

      {
        id: 'indicador-preforma',
        name: 'Indicador Pré-formas'
      },

      {
        id: 'ultimos-preforma',
        name: 'Últimos Apontamentos — Pré-formas'
      },

      {
        id: 'indicador-tampas',
        name: 'Indicador Tampas'
      },

      {
        id: 'ultimos-tampas',
        name: 'Últimos Apontamentos — Tampas'
      }

    ];


    let dados = null;

    let currentScreen = 0;

    let nextChange =
      Date.now() +
      SCREEN_INTERVAL;

    let requesting = false;

    let retryIndex = 0;

    let lastSuccessTime = 0;

    let refreshTimer = null;


    /**
     * ============================================================
     * INICIALIZAÇÃO
     * ============================================================
     */
    document.addEventListener(
      'DOMContentLoaded',
      iniciar
    );


    function iniciar() {

      criarDots();


      /**
       * ==========================================================
       * RECUPERA ÚLTIMOS DADOS BONS
       * ==========================================================
       */
      recuperarDadosLocais();


      /**
       * Consulta imediatamente.
       */
      carregarDados();


      /**
       * Relógio / rotação.
       */
      setInterval(
        controlarRotacao,
        1000
      );


      /**
       * Watchdog da conexão.
       */
      setInterval(
        atualizarStatusConexao,
        5000
      );

    }


    /**
     * ============================================================
     * LOCAL STORAGE
     * ============================================================
     */
    function recuperarDadosLocais() {

      try {

        const salvo =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!salvo) {
          return;
        }


        const obj =
          JSON.parse(
            salvo
          );


        if (
          !obj ||
          !obj.dados
        ) {

          return;

        }


        dados =
          obj.dados;


        lastSuccessTime =
          Number(
            obj.salvoEm || 0
          );


        renderizar();


        document
          .getElementById(
            'loading'
          )
          .classList
          .add(
            'hidden'
          );


        mostrarTela(
          currentScreen,
          false
        );


        atualizarStatusConexao();

      } catch (erro) {

        console.log(
          'Cache local inválido.'
        );

      }

    }


    function salvarDadosLocais() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(
            {

              salvoEm:
                Date.now(),

              dados:
                dados

            }
          )
        );

      } catch (erro) {

        // Não impede funcionamento.

      }

    }


    /**
     * ============================================================
     * AGENDAR PRÓXIMA ATUALIZAÇÃO
     * ============================================================
     */
    function agendarAtualizacaoNormal() {

      if (refreshTimer) {

        clearTimeout(
          refreshTimer
        );

      }


      refreshTimer =
        setTimeout(
          carregarDados,
          DATA_INTERVAL
        );

    }


    /**
     * ============================================================
     * CHAMADA JSONP
     * ============================================================
     */
    function carregarDados() {

      if (requesting) {

        return;

      }


      requesting = true;


      const callback =
        'mutersilCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          'script'
        );


      let finalizado =
        false;


      const timeout =
        setTimeout(
          () => {

            if (finalizado) {
              return;
            }


            finalizado =
              true;


            requesting =
              false;


            limpar();


            tratarFalha(
              'Tempo limite na comunicação.'
            );

          },
          REQUEST_TIMEOUT
        );


      function limpar() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callback
          ];

        } catch (erro) {

          window[
            callback
          ] =
            undefined;

        }


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callback
      ] =
        function(
          resposta
        ) {

          if (finalizado) {
            return;
          }


          finalizado =
            true;


          requesting =
            false;


          limpar();


          if (
            !resposta ||
            !resposta.sucesso
          ) {

            tratarFalha(
              resposta &&
              resposta.erro
                ? resposta.erro
                : 'Resposta inválida.'
            );


            return;

          }


          /**
           * ======================================================
           * SUCESSO
           * ======================================================
           */
          dados =
            resposta;


          lastSuccessTime =
            Date.now();


          retryIndex =
            0;


          salvarDadosLocais();


          esconderAviso();


          renderizar();


          document
            .getElementById(
              'loading'
            )
            .classList
            .add(
              'hidden'
            );


          atualizarStatusConexao();


          agendarAtualizacaoNormal();

        };


      script.onerror =
        function() {

          if (finalizado) {
            return;
          }


          finalizado =
            true;


          requesting =
            false;


          limpar();


          tratarFalha(
            'Falha temporária na conexão.'
          );

        };


      const separador =
        API_URL.indexOf(
          '?'
        ) === -1
          ? '?'
          : '&';


      script.src =
        API_URL +
        separador +
        'callback=' +
        encodeURIComponent(
          callback
        ) +
        '&_=' +
        Date.now();


      document.head
        .appendChild(
          script
        );

    }


    /**
     * ============================================================
     * TRATAMENTO DE FALHA
     * ============================================================
     */
    function tratarFalha(
      mensagem
    ) {

      atualizarStatusConexao(
        true
      );


      /**
       * Ainda temos novas tentativas.
       */
      if (
        retryIndex <
        RETRY_DELAYS.length
      ) {

        const espera =
          RETRY_DELAYS[
            retryIndex
          ];


        retryIndex++;


        /**
         * Aviso discreto.
         *
         * Não mostramos uma grande faixa vermelha
         * na primeira oscilação.
         */
        mostrarAviso(
          'Reconectando... tentativa ' +
          retryIndex +
          '/' +
          RETRY_DELAYS.length,
          false
        );


        if (refreshTimer) {

          clearTimeout(
            refreshTimer
          );

        }


        refreshTimer =
          setTimeout(
            carregarDados,
            espera
          );


        return;

      }


      /**
       * Tentativas esgotadas.
       *
       * Continua mostrando o último dado.
       */
      retryIndex =
        0;


      const idade =
        lastSuccessTime > 0
          ? Date.now() -
            lastSuccessTime
          : Infinity;


      if (
        idade >=
        OFFLINE_AFTER
      ) {

        mostrarAviso(
          'Sem atualização há mais de 5 minutos. Mantendo os últimos dados disponíveis.',
          true
        );

      } else {

        mostrarAviso(
          'Oscilação de conexão. Mantendo os últimos dados.',
          false
        );

      }


      /**
       * Tenta novamente em 60 segundos.
       */
      agendarAtualizacaoNormal();

    }


    /**
     * ============================================================
     * STATUS DA CONEXÃO
     * ============================================================
     */
    function obterConnectionInfo() {

      if (
        lastSuccessTime <= 0
      ) {

        return {

          classe:
            'reconnecting',

          texto:
            'CONECTANDO'

        };

      }


      const idade =
        Date.now() -
        lastSuccessTime;


      if (
        idade >=
        OFFLINE_AFTER
      ) {

        return {

          classe:
            'offline',

          texto:
            'SEM CONEXÃO'

        };

      }


      if (
        requesting ||
        retryIndex > 0
      ) {

        return {

          classe:
            'reconnecting',

          texto:
            'RECONECTANDO'

        };

      }


      return {

        classe:
          'online',

        texto:
          'AO VIVO'

      };

    }


    function atualizarStatusConexao() {

      if (!dados) {
        return;
      }


      /**
       * Re-renderiza apenas o cabeçalho atual,
       * preservando as telas.
       */
      const itens =
        document.querySelectorAll(
          '.connection'
        );


      const info =
        obterConnectionInfo();


      itens.forEach(
        item => {

          item.className =
            'connection ' +
            info.classe;


          const texto =
            item.querySelector(
              '.connection-text'
            );


          if (texto) {

            texto.textContent =
              info.texto;

          }

        }
      );

    }

     * ============================================================
     * AVISOS
     * ============================================================
     */
    function mostrarAviso(
      mensagem,
      erro
    ) {

      const box =
        document.getElementById(
          'notice'
        );


      box.textContent =
        mensagem;


      box.className =
        erro
          ? 'error'
          : '';


      box.style.display =
        'block';


      /**
       * Avisos amarelos desaparecem.
       */
      if (!erro) {

        setTimeout(
          () => {

            if (
              box.className !==
              'error'
            ) {

              box.style.display =
                'none';

            }

          },
          7000
        );

      }

    }


    function esconderAviso() {

      const box =
        document.getElementById(
          'notice'
        );


      box.style.display =
        'none';


      box.className =
        '';

    }

      unidade

      if (!indicador) {

    function linhaTurno(
      turno,
      unidade
    ) {

      const temDados =
        turno.apontamentos > 0;


      const refugoTexto =
        !temDados
          ? '—'
          :
          turno.refugoPct === null
            ? (
                turno.refugo > 0
                  ? 'N/D'
                  : '—'
              )
            :
            numero(
              turno.refugoPct,
              2
            ) + '%';


      const classeRefugo =
        turno.refugoPct === null
          ? (
              turno.refugo > 0
                ? 'bad'
                : ''
            )
          :
          turno.refugoPct <
          dados.metaRefugo
            ? 'good'
            : 'bad';


      return `

        <div class="turn">

          <div class="turn-top">

            <div class="turn-name">

              ${escapeHtml(
                turno.turno
              )}

            </div>


            <div class="turn-value">

              ${
                temDados
                  ? numero(
                      turno.producao,
                      unidade ===
                      'peças/h'
                        ? 0
                        : 2
                    )
                  : '—'
              }

            </div>


            <div
              class="
                turn-value
                ${
                  temDados
                    ? (
                        turno.eficiencia >= 100
                          ? 'good'
                          : 'bad'
                      )
                    : ''
                }
              "
            >

              ${
                temDados
                  ? numero(
                      turno.eficiencia,
                      1
                    ) + '%'
                  : '—'
              }

            </div>


            <div
              class="
                turn-value
                ${classeRefugo}
              "
            >

              ${refugoTexto}

            </div>

          </div>


          <div class="progress">

            <div
              class="progress-fill"
              style="
                width:
                ${
                  Math.max(
                    0,
                    Math.min(
                      100,
                      temDados
                        ? turno.eficiencia
                        : 0
                    )
                  )
                }%;
              "
            ></div>

          </div>

        </div>

      `;

    }

    /**
     * ============================================================
     * ROTAÇÃO
     * ============================================================
     */
    function controlarRotacao() {

      if (!dados) {
        return;
      }


      const faltam =
        Math.max(
          0,
          Math.ceil(
            (
              nextChange -
              Date.now()
            ) /
            1000
          )
        );


      document
        .getElementById(
          'timer'
        )
        .textContent =
          'Próxima tela em ' +
          faltam +
          's';


      if (
        Date.now() >=
        nextChange
      ) {

        mostrarTela(
          currentScreen + 1
        );

      }

    }


    function mostrarTela(
      indice,
      resetTimer = true
    ) {

      currentScreen =
        (
          indice +
          SCREENS.length
        ) %
        SCREENS.length;


      document
        .querySelectorAll(
          '.screen'
        )
        .forEach(
          tela =>
            tela.classList
              .remove(
                'active'
              )
        );


      const alvo =
        document.getElementById(
          SCREENS[
            currentScreen
          ].id
        );


      if (alvo) {

        alvo.classList
          .add(
            'active'
          );

      }


      document
        .getElementById(
          'screen-name'
        )
        .textContent =
          SCREENS[
            currentScreen
          ].name;


      atualizarDots();


      if (resetTimer) {

        nextChange =
          Date.now() +
          SCREEN_INTERVAL;

      }

    }


    /**
     * ============================================================
     * DOTS
     * ============================================================
     */
    function criarDots() {

      document
        .getElementById(
          'dots'
        )
        .innerHTML =
          SCREENS
            .map(
              () =>
                '<span class="dot"></span>'
            )
            .join('');

    }


    function atualizarDots() {

      document
        .querySelectorAll(
          '.dot'
        )
        .forEach(
          (
            dot,
            i
          ) => {

            dot.classList
              .toggle(
                'active',
                i ===
                currentScreen
              );

          }
        );

    }


    /**
     * ============================================================
     * STATUS
     * ============================================================
     */
    function statusPill(
      status
    ) {

      if (
        status ===
        'OK'
      ) {

        return `

          <span
            class="
              status-pill
              status-ok
            "
          >
            ● OK
          </span>

        `;

      }


      if (
        status ===
        'ALERTA'
      ) {

        return `

          <span
            class="
              status-pill
              status-alert
            "
          >
            ● ALERTA
          </span>

        `;

      }


      return `

        <span
          class="
            status-pill
            status-none
          "
        >
          SEM DADOS
        </span>

      `;

    }


    function vazio(
      mensagem
    ) {

      return `

        <div class="empty">

          ${escapeHtml(
            mensagem
          )}

        </div>

      `;

    }


    /**
     * ============================================================
     * FORMATAÇÃO
     * ============================================================
     */
    function numero(
      valor,
      casas
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ''
      ) {

        return '—';

      }


      const n =
        Number(
          valor
        );


      if (
        Number.isNaN(
          n
        )
      ) {

        return '—';

      }


      return n.toLocaleString(
        'pt-BR',
        {

          minimumFractionDigits:
            casas,

          maximumFractionDigits:
            casas

        }
      );

    }


    function escapeHtml(
      valor
    ) {

      const div =
        document.createElement(
          'div'
        );


      div.textContent =
        valor === null ||
        valor === undefined
          ? ''
          :
          String(
            valor
          );


      return div.innerHTML;

    }

  </script>
