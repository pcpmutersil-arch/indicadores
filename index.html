<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MUTERSIL — Produção</title>


  <style>

    :root {

      --bg: #06101c;
      --card: #10253c;
      --text: #f1f7fd;
      --muted: #9fb3c8;

      --blue: #1498ff;
      --cyan: #10d8e8;

      --green: #24d68f;
      --yellow: #ffd052;
      --red: #ff4357;

      --border:
        rgba(255,255,255,.10);

    }


    * {

      box-sizing:
        border-box;

    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      overflow: hidden;

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color:
        var(--text);

      background:

        radial-gradient(
          circle at 90% 0%,
          #17497c 0%,
          #0a1c30 32%,
          #050b13 75%
        );

    }


    #app {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

    }


    /* ===========================================================
       TELAS
       =========================================================== */

    .screen {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      padding:
        20px
        32px
        55px;

      opacity: 0;

      pointer-events: none;

      transform:
        translateX(35px);

      transition:
        opacity .45s ease,
        transform .45s ease;

    }


    .screen.active {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateX(0);

    }


    /* ===========================================================
       CABEÇALHO
       =========================================================== */

    .header {

      height: 100px;

      display: grid;

      grid-template-columns:
        180px
        1fr
        270px;

      gap: 16px;

      align-items: center;

      margin-bottom: 15px;

    }


    .logo {

      max-width: 165px;
      max-height: 85px;

      object-fit: contain;

      background: white;

      padding: 4px;

    }


    .title-area {

      text-align: center;

    }


    .title {

      font-size:
        clamp(
          30px,
          2.6vw,
          52px
        );

      font-weight: 900;

      line-height: 1;

      letter-spacing: .5px;

    }


    .subtitle {

      margin-top: 9px;

      color:
        var(--muted);

      font-size:
        clamp(
          15px,
          1.05vw,
          21px
        );

      font-weight: 700;

    }


    .header-right {

      display: flex;

      flex-direction: column;

      align-items: flex-end;

      gap: 7px;

    }


    .connection {

      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 16px;

      font-weight: 900;

    }


    .connection-dot {

      width: 11px;
      height: 11px;

      border-radius: 50%;

    }


    .connection.online {

      color:
        var(--green);

    }


    .connection.online
    .connection-dot {

      background:
        var(--green);

      box-shadow:
        0 0 14px
        var(--green);

    }


    .connection.reconnecting {

      color:
        var(--yellow);

    }


    .connection.reconnecting
    .connection-dot {

      background:
        var(--yellow);

    }


    .connection.offline {

      color:
        var(--red);

    }


    .connection.offline
    .connection-dot {

      background:
        var(--red);

    }


    .updated {

      color:
        var(--muted);

      font-size: 13px;

      font-weight: 700;

      text-align: right;

    }


    /* ===========================================================
       AVISO CONEXÃO
       =========================================================== */

    #notice {

      display: none;

      position: fixed;

      top: 10px;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 5000;

      padding:
        10px
        20px;

      border-radius: 12px;

      background:
        var(--yellow);

      color: #111;

      font-weight: 900;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    }


    #notice.error {

      color: white;

      background:
        var(--red);

    }


    /* ===========================================================
       CARD
       =========================================================== */

    .card {

      background:

        linear-gradient(
          145deg,
          rgba(20,43,70,.96),
          rgba(8,22,38,.97)
        );

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.28);

    }


    /* ===========================================================
       PRODUÇÃO AGORA
       =========================================================== */

    .overview {

      height:
        calc(
          100vh -
          180px
        );

      padding:
        15px
        18px;

    }


    .overview-table {

      width: 100%;
      height: 100%;

      table-layout: fixed;

      border-collapse: collapse;

    }


    .overview-table th {

      color:
        var(--muted);

      padding: 10px;

      text-align: center;

      text-transform: uppercase;

      font-size:
        clamp(
          14px,
          1vw,
          19px
        );

      border-bottom:
        2px solid
        rgba(255,255,255,.09);

    }


    .overview-table td {

      padding:
        11px 12px;

      text-align: center;

      border-bottom:
        1px solid
        rgba(255,255,255,.07);

      font-size:
        clamp(
          19px,
          1.4vw,
          29px
        );

      font-weight: 800;

    }


    .overview-table .name {

      text-align: left;

      font-size:
        clamp(
          20px,
          1.55vw,
          32px
        );

      font-weight: 900;

    }


    .production-value {

      font-size: 1.35em;

      font-weight: 950;

    }


    .unit {

      display: block;

      margin-top: 3px;

      color:
        var(--muted);

      font-size: 11px;

    }


    .status-pill {

      display: inline-flex;

      min-width: 130px;

      justify-content: center;

      align-items: center;

      padding:
        9px 14px;

      border-radius: 999px;

      font-size: 16px;

      font-weight: 900;

    }


    .status-ok {

      color: #06170f;

      background:
        var(--green);

    }


    .status-alert {

      color: white;

      background:
        var(--red);

    }


    .status-none {

      color: #d7e0e9;

      background: #52647a;

    }


    .good {

      color:
        var(--green);

    }


    .bad {

      color:
        var(--red);

    }


    /* ===========================================================
       INDICADORES
       =========================================================== */

    .machine-grid {

      height:
        calc(
          100vh -
          180px
        );

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: 15px;

    }


    .machine-grid.single {

      grid-template-columns: 1fr;

    }


    .machine {

      padding:
        19px
        20px;

      overflow: hidden;

    }


    .machine-title {

      margin-bottom: 17px;

      text-align: center;

      font-size:
        clamp(
          25px,
          1.8vw,
          37px
        );

      font-weight: 950;

    }


    .labels,
    .turn-top {

      display: grid;

      grid-template-columns:
        1.2fr
        1fr
        1fr
        1fr;

      gap: 9px;

      align-items: center;

    }


    .labels {

      margin-bottom: 3px;

      color:
        var(--muted);

      font-size: 11px;

      font-weight: 900;

      text-transform: uppercase;

    }


    .labels div:not(:first-child) {

      text-align: center;

    }


    .turn {

      padding:
        14px 0;

      border-top:
        1px solid
        rgba(255,255,255,.08);

    }


    .turn-name {

      font-size:
        clamp(
          16px,
          1.15vw,
          23px
        );

      font-weight: 900;

    }


    .turn-value {

      text-align: center;

      font-size:
        clamp(
          17px,
          1.15vw,
          23px
        );

      font-weight: 900;

    }


    .progress {

      width: 100%;
      height: 13px;

      margin-top: 9px;

      overflow: hidden;

      border-radius: 999px;

      background:
        rgba(255,255,255,.08);

    }


    .progress-fill {

      height: 100%;

      border-radius: inherit;

      background:

        linear-gradient(
          90deg,
          var(--blue),
          var(--cyan)
        );

    }


    .machine-footer {

      display: flex;

      justify-content:
        space-between;

      margin-top: 18px;

      padding-top: 12px;

      border-top:
        1px solid
        rgba(255,255,255,.08);

      color:
        var(--muted);

      font-size: 14px;

      font-weight: 800;

    }


    /* ===========================================================
       ÚLTIMOS APONTAMENTOS
       =========================================================== */

    .recent-card {

      height:
        calc(
          100vh -
          180px
        );

      padding:
        8px
        14px
        12px;

    }


    .recent-wrap {

      height:
        calc(
          100% -
          34px
        );

      overflow: hidden;

    }


    .recent-table {

      width: 100%;

      border-collapse: separate;

      border-spacing:
        0 5px;

      table-layout: fixed;

    }


    .recent-table th {

      padding: 7px;

      text-align: left;

      color:
        var(--muted);

      text-transform: uppercase;

      font-size:
        clamp(
          12px,
          .85vw,
          16px
        );

    }


    .recent-table td {

      padding:
        8px 7px;

      background:
        rgba(255,255,255,.045);

      border-top:
        1px solid
        rgba(255,255,255,.055);

      border-bottom:
        1px solid
        rgba(255,255,255,.055);

      font-size:
        clamp(
          13px,
          .98vw,
          19px
        );

      font-weight: 700;

      line-height: 1.13;

    }


    .recent-table tr.alert td {

      color: white;

      background:

        linear-gradient(
          90deg,
          rgba(236,42,66,.94),
          rgba(189,25,50,.94)
        );

    }


    .obs {

      white-space: normal;

      overflow-wrap: anywhere;

    }


    .empty {

      height: 100%;

      display: grid;

      place-items: center;

      color:
        var(--muted);

      text-align: center;

      font-size:
        clamp(
          24px,
          2vw,
          40px
        );

      font-weight: 900;

    }


    .attention {

      height: 30px;

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        var(--muted);

      font-size: 14px;

      font-weight: 900;

    }


    /* ===========================================================
       FOOTER
       =========================================================== */

    #footer {

      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      z-index: 500;

      height: 42px;

      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: center;

      padding:
        0 28px;

      color:
        var(--muted);

      background:
        rgba(2,8,15,.92);

      border-top:
        1px solid
        rgba(255,255,255,.08);

    }


    #timer {

      text-align: right;

      font-size: 13px;

      font-weight: 800;

    }


    #screen-name {

      font-size: 13px;

      font-weight: 800;

    }


    #dots {

      display: flex;

      gap: 8px;

    }


    .dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.23);

    }


    .dot.active {

      width: 25px;

      border-radius: 999px;

      background:
        var(--cyan);

      box-shadow:
        0 0 12px
        rgba(16,216,232,.5);

    }


    /* ===========================================================
       LOADING
       =========================================================== */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 2000;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      gap: 20px;

      background:

        radial-gradient(
          circle,
          #123b64,
          #050b13 65%
        );

      transition:
        opacity .5s ease;

    }


    #loading.hidden {

      opacity: 0;

      pointer-events: none;

    }


    .spinner {

      width: 65px;
      height: 65px;

      border:
        6px solid
        rgba(255,255,255,.12);

      border-top-color:
        var(--cyan);

      border-radius: 50%;

      animation:
        girar .9s linear infinite;

    }


    @keyframes girar {

      to {

        transform:
          rotate(360deg);

      }

    }

  </style>

</head>


<body>


  <div id="app"></div>

  <div id="notice"></div>


  <div id="loading">

    <div class="spinner"></div>

    <div
      style="
        font-size:28px;
        font-weight:950;
      "
    >
      MUTERSIL
    </div>

    <div>
      Carregando produção...
    </div>

  </div>


  <footer id="footer">

    <div id="screen-name">
      Inicializando
    </div>

    <div id="dots"></div>

    <div id="timer">
      —
    </div>

  </footer>


  <script>

    /**
     * Se a implantação /exec mudou,
     * altere somente esta URL.
     */
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzeZqe2NVkftxvOVrDFGRYTlxOhJuKzVVt59TyJxRxV2O-6fY4zxHuqHDz_FttbsQFUng/exec';


    const LOGO_URL =
      'https://drive.google.com/thumbnail?id=1cVRA4xRIeOICfUG0FkOzuhwI2YVYOdII&sz=w500';


    const SCREEN_INTERVAL =
      30000;


    const DATA_INTERVAL =
      60000;


    const REQUEST_TIMEOUT =
      25000;


    const RETRY_DELAYS = [

      3000,

      8000,

      15000

    ];


    const OFFLINE_AFTER =
      5 * 60 * 1000;


    /**
     * Nova chave para não recuperar dados antigos
     * com regras anteriores.
     */
    const STORAGE_KEY =
      'MUTERSIL_DASHBOARD_LAST_GOOD_V5';


    const SCREENS = [

      {
        id:
          'producao-agora',

        name:
          'Produção Agora'
      },

      {
        id:
          'indicador-potes',

        name:
          'Indicador Potes'
      },

      {
        id:
          'ultimos-potes',

        name:
          'Últimos Apontamentos — Potes'
      },

      {
        id:
          'indicador-preforma',

        name:
          'Indicador Pré-formas'
      },

      {
        id:
          'ultimos-preforma',

        name:
          'Últimos Apontamentos — Pré-formas'
      },

      {
        id:
          'indicador-tampas',

        name:
          'Indicador Tampas'
      },

      {
        id:
          'ultimos-tampas',

        name:
          'Últimos Apontamentos — Tampas'
      }

    ];


    let dados =
      null;


    let currentScreen =
      0;


    let nextChange =
      Date.now() +
      SCREEN_INTERVAL;


    let requesting =
      false;


    let retryIndex =
      0;


    let lastSuccessTime =
      0;


    let refreshTimer =
      null;


    document.addEventListener(
      'DOMContentLoaded',
      iniciar
    );


    function iniciar() {

      criarDots();

      recuperarDadosLocais();

      carregarDados();


      setInterval(
        controlarRotacao,
        1000
      );


      setInterval(
        atualizarStatusConexao,
        5000
      );

    }


    /* ============================================================
       LOCAL STORAGE
       ============================================================ */

    function recuperarDadosLocais() {

      try {

        const salvo =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!salvo) {

          return;

        }


        const obj =
          JSON.parse(salvo);


        if (
          !obj ||
          !obj.dados
        ) {

          return;

        }


        dados =
          obj.dados;


        lastSuccessTime =
          Number(
            obj.salvoEm || 0
          );


        renderizar();


        document
          .getElementById(
            'loading'
          )
          .classList
          .add(
            'hidden'
          );


        atualizarStatusConexao();


      } catch (erro) {

        console.log(
          'Cache local ignorado.'
        );

      }

    }


    function salvarDadosLocais() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(
            {

              salvoEm:
                Date.now(),

              dados:
                dados

            }
          )
        );

      } catch (erro) {

        // Ignora.

      }

    }


    /* ============================================================
       ATUALIZAÇÃO
       ============================================================ */

    function agendarAtualizacaoNormal() {

      if (refreshTimer) {

        clearTimeout(
          refreshTimer
        );

      }


      refreshTimer =
        setTimeout(
          carregarDados,
          DATA_INTERVAL
        );

    }


    function carregarDados() {

      if (requesting) {

        return;

      }


      requesting =
        true;


      const callback =
        'mutersilCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          'script'
        );


      let finalizado =
        false;


      const timeout =
        setTimeout(
          () => {

            if (finalizado) {

              return;

            }


            finalizado =
              true;


            requesting =
              false;


            limpar();


            tratarFalha(
              'Tempo limite na comunicação.'
            );

          },
          REQUEST_TIMEOUT
        );


      function limpar() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callback
          ];

        } catch (erro) {

          window[
            callback
          ] =
            undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callback
      ] =
        function(
          resposta
        ) {

          if (finalizado) {

            return;

          }


          finalizado =
            true;


          requesting =
            false;


          limpar();


          if (
            !resposta ||
            !resposta.sucesso
          ) {

            tratarFalha(
              resposta &&
              resposta.erro
                ? resposta.erro
                : 'Resposta inválida.'
            );


            return;

          }


          dados =
            resposta;


          lastSuccessTime =
            Date.now();


          retryIndex =
            0;


          salvarDadosLocais();

          esconderAviso();

          renderizar();


          document
            .getElementById(
              'loading'
            )
            .classList
            .add(
              'hidden'
            );


          atualizarStatusConexao();

          agendarAtualizacaoNormal();

        };


      script.onerror =
        function() {

          if (finalizado) {

            return;

          }


          finalizado =
            true;


          requesting =
            false;


          limpar();


          tratarFalha(
            'Falha temporária na conexão.'
          );

        };


      script.src =
        API_URL +
        '?callback=' +
        encodeURIComponent(
          callback
        ) +
        '&_=' +
        Date.now();


      document.head
        .appendChild(
          script
        );

    }


    function tratarFalha(
      mensagem
    ) {

      if (
        retryIndex <
        RETRY_DELAYS.length
      ) {

        const espera =
          RETRY_DELAYS[
            retryIndex
          ];


        retryIndex++;


        mostrarAviso(
          'Reconectando... tentativa ' +
          retryIndex +
          '/' +
          RETRY_DELAYS.length,
          false
        );


        refreshTimer =
          setTimeout(
            carregarDados,
            espera
          );


        atualizarStatusConexao();

        return;

      }


      retryIndex =
        0;


      const idade =
        lastSuccessTime > 0
          ? Date.now() -
            lastSuccessTime
          : Infinity;


      if (
        idade >=
        OFFLINE_AFTER
      ) {

        mostrarAviso(
          'Sem atualização há mais de 5 minutos. Mantendo os últimos dados.',
          true
        );

      } else {

        mostrarAviso(
          'Oscilação de conexão. Mantendo os últimos dados.',
          false
        );

      }


      atualizarStatusConexao();

      agendarAtualizacaoNormal();

    }


    /* ============================================================
       CONEXÃO
       ============================================================ */

    function obterConnectionInfo() {

      if (
        lastSuccessTime <= 0
      ) {

        return {

          classe:
            'reconnecting',

          texto:
            'CONECTANDO'

        };

      }


      const idade =
        Date.now() -
        lastSuccessTime;


      if (
        idade >=
        OFFLINE_AFTER
      ) {

        return {

          classe:
            'offline',

          texto:
            'SEM CONEXÃO'

        };

      }


      if (
        requesting ||
        retryIndex > 0
      ) {

        return {

          classe:
            'reconnecting',

          texto:
            'RECONECTANDO'

        };

      }


      return {

        classe:
          'online',

        texto:
          'AO VIVO'

      };

    }


    function atualizarStatusConexao() {

      const info =
        obterConnectionInfo();


      document
        .querySelectorAll(
          '.connection'
        )
        .forEach(
          item => {

            item.className =
              'connection ' +
              info.classe;


            const texto =
              item.querySelector(
                '.connection-text'
              );


            if (texto) {

              texto.textContent =
                info.texto;

            }

          }
        );

    }


    function mostrarAviso(
      mensagem,
      erro
    ) {

      const box =
        document.getElementById(
          'notice'
        );


      box.textContent =
        mensagem;


      box.className =
        erro
          ? 'error'
          : '';


      box.style.display =
        'block';


      if (!erro) {

        setTimeout(
          () => {

            if (
              box.className !==
              'error'
            ) {

              box.style.display =
                'none';

            }

          },
          7000
        );

      }

    }


    function esconderAviso() {

      const box =
        document.getElementById(
          'notice'
        );


      box.style.display =
        'none';


      box.className =
        '';

    }


    /* ============================================================
       RENDERIZAÇÃO
       ============================================================ */

    function renderizar() {

      if (!dados) {

        return;

      }


      document
        .getElementById(
          'app'
        )
        .innerHTML = [

          telaProducaoAgora(),

          telaIndicadorPotes(),

          telaUltimosPotes(),

          telaIndicadorPreforma(),

          telaUltimosPreforma(),

          telaIndicadorTampas(),

          telaUltimosTampas()

        ].join('');


      mostrarTela(
        currentScreen,
        false
      );


      atualizarStatusConexao();

    }


    /* ============================================================
       CABEÇALHO
       ============================================================ */

    function header(
      titulo,
      subtitulo
    ) {

      const conexao =
        obterConnectionInfo();

            <img
              class="logo"
              src="${LOGO_URL}"

            >

          <div class="title-area">

            <div class="title">
              ${escapeHtml(titulo)}
            </div>

            <div class="subtitle">
              ${escapeHtml(subtitulo || '')}
            </div>

          </div>


          <div class="header-right">

            <div
              class="
                connection
                ${conexao.classe}
              "
            >

              <span
                class="connection-dot"
              ></span>

              <span
                class="connection-text"
              >
                ${conexao.texto}
              </span>

            </div>

              Dados:
              ${escapeHtml(

              )}

            </div>

          </div>

    /* ============================================================
       PRODUÇÃO AGORA
       ============================================================ */

    function telaProducaoAgora() {

      return `

        <section
          id="producao-agora"
          class="screen"
        >

          ${header(
            'MUTERSIL — PRODUÇÃO AGORA',
            'Indicadores do turno atual'
          )}


          <div class="card overview">

            <table class="overview-table">

              <thead>

                <tr>

                  <th
                    style="
                      width:22%;
                      text-align:left;
                    "
                  >
                    Processo
                  </th>

                  <th>Produção</th>

                  <th>Meta</th>

                  <th>Eficiência</th>

                  <th>Refugo</th>

                  <th>Turno</th>

                  <th>Status</th>

                </tr>

              </thead>


              <tbody>

                ${

                    .producaoAgora
                    .map(
                      linhaProducaoAgora
                    )

              </tbody>

            </table>

    function linhaProducaoAgora(
      item
    ) {

      return `

        <tr>

          <td class="name">
            ${escapeHtml(item.nome)}
          </td>


          <td>

            <span class="production-value">

              ${
                item.producao === null
                  ? '—'
                  :
                  numero(
                    item.producao,
                    item.unidade ===
                    'peças/h'
                      ? 0
                      : 1
                  )
              }

            </span>

            <span class="unit">
              ${escapeHtml(item.unidade)}
            </span>

          </td>


          <td>

            ${metaDisplay(item)}

          </td>


          <td
            class="
              ${
                classeEficiencia(
                  item.eficiencia,
                  item.eficienciaMinima
                )
              }
            "
          >

            ${
              item.eficiencia === null
                ? '—'
                :
                numero(
                  item.eficiencia,
                  1
                ) + '%'
            }

          </td>


          <td
            class="
              ${
                classeRefugo(
                  item.refugoPct,
                  item.refugo
                )
              }
            "
          >

            ${textoRefugo(
              item.refugoPct,
              item.refugo
            )}

          </td>


          <td>
            ${escapeHtml(item.turno)}
          </td>


          <td>
            ${statusPill(item.status)}
          </td>

        </tr>

      `;

    }


    /* ============================================================
       INDICADOR POTES
       ============================================================ */

    function telaIndicadorPotes() {

      return `

        <section
          id="indicador-potes"
          class="screen"
        >

          ${header(
            'INDICADOR PRODUÇÃO POTES',
            'Média de fardos por hora — hoje'
          )}


          <div class="machine-grid">

            ${
              [
                'JS 600',
                'JS 2000',
                'JS 2026'
              ]
                .map(
                  nome =>
                    painelPotes(
                      nome,
                      dados
                        .potes
                        .maquinas[
                          nome
                        ]
                    )
                )
                .join('')
            }

          </div>

        </section>

      `;

    }


    function painelPotes(
      titulo,
      indicador
    ) {

      if (!indicador) {

        return '';

      }


      return `

        <div class="card machine">

          <div class="machine-title">
            ${escapeHtml(titulo)}
          </div>


          <div class="labels">

            <div>Turno</div>
            <div>Produção</div>
            <div>Eficiência</div>
            <div>Refugo</div>

          </div>


          ${
            indicador
              .turnos
              .map(
                turno =>
                  linhaTurno(
                    turno,
                    'fardos/h'
                  )
              )
              .join('')
          }


          <div class="machine-footer">

            <span>

              ${
                indicador.metaVariavel
                  ?
                  (
                    indicador.ultimaReferencia
                      ?
                      'Meta atual: ' +
                      numero(
                        indicador.meta,
                        0
                      ) +
                      ' fardos/h (' +
                      escapeHtml(
                        indicador.ultimaReferencia
                      ) +
                      ')'
                      :
                      'Meta conforme produto'
                  )
                  :
                  'Meta: ' +
                  numero(
                    indicador.meta,
                    0
                  ) +
                  ' fardos/h'
              }

            </span>


            <span>

              Verde ≥
              ${numero(
                indicador.eficienciaMinima,
                0
              )}%
              •
              Refugo &lt;
              ${numero(
                dados.metaRefugo,
                1
              )}%

            </span>

          </div>

        </div>

      `;

    }


    /* ============================================================
       LINHA DE TURNO
       ============================================================ */

    function linhaTurno(
      turno,
      unidade
    ) {

      const temDados =
        turno.apontamentos > 0;


      const eficiencia =
        temDados
          ? turno.eficiencia
          : null;


      return `

        <div class="turn">

          <div class="turn-top">

            <div class="turn-name">
              ${escapeHtml(turno.turno)}
            </div>


            <div class="turn-value">

              ${
                temDados
                  ?
                  numero(
                    turno.producao,
                    unidade ===
                    'peças/h'
                      ? 0
                      : 2
                  )
                  :
                  '—'
              }

            </div>


            <div
              class="
                turn-value
                ${
                  classeEficiencia(
                    eficiencia,
                    turno.eficienciaMinima
                  )
                }
              "
            >

              ${
                eficiencia === null
                  ? '—'
                  :
                  numero(
                    eficiencia,
                    1
                  ) + '%'
              }

            </div>


            <div
              class="
                turn-value
                ${
                  classeRefugo(
                    turno.refugoPct,
                    turno.refugo
                  )
                }
              "
            >

              ${textoRefugo(
                turno.refugoPct,
                turno.refugo
              )}

            </div>

          </div>


          <div class="progress">

            <div
              class="progress-fill"
              style="
                width:
                ${
                  Math.max(
                    0,
                    Math.min(
                      100,
                      eficiencia || 0
                    )
                  )
                }%;
              "
            ></div>

          </div>

        </div>

      `;

    }


    /* ============================================================
       ÚLTIMOS POTES
       ============================================================ */

    function telaUltimosPotes() {

            <div class="attention">

              OBSERVAÇÃO
              •
              EFICIÊNCIA &lt;
              ${numero(

                  .eficienciaMinima,

              TEMPO PERDIDO

    function tabelaPotes(

    ) {

      if (
        !registros ||
        registros.length === 0
      ) {

        return vazio(

        );

      }


      return `

        <div class="recent-wrap">

          <table class="recent-table">

            <colgroup>

              <col style="width:7%">
              <col style="width:8%">
              <col style="width:9%">
              <col style="width:10%">
              <col style="width:9%">
              <col style="width:7%">
              <col style="width:7%">
              <col style="width:10%">
              <col style="width:33%">

            </colgroup>


            <thead>

              <tr>

                <th>Hora</th>
                <th>Máq.</th>
                <th>Turno</th>
                <th>Líder</th>
                <th>Pote</th>
                <th>Fardos</th>
                <th>Refugo</th>
                <th>Tempo perdido</th>
                <th>Observação</th>

              </tr>

            </thead>


            <tbody>

              ${
                registros
                  .map(
                    r => `

                      <tr

                          ${
                            r.alerta
                              ? 'alert'

                          }
                        "
                      >

                        <td>
                          ${escapeHtml(r.hora)}
                        </td>

                        <td>
                          ${escapeHtml(r.maquina)}
                        </td>

                        <td>
                          ${escapeHtml(r.turno)}
                        </td>

                        <td>
                          ${escapeHtml(r.lider)}
                        </td>

                          ${escapeHtml(r.referencia)}
                        </td>

                        <td>
                          <strong>
                            ${numero(r.fardos,0)}
                          </strong>
                        </td>

                        <td>
                          ${numero(r.refugo,0)}
                        </td>

                        <td>
                          ${escapeHtml(
                            r.tempoPerdido ||
                            '—'
                          )}
                        </td>

                        <td class="obs">
                          ${escapeHtml(
                            r.observacao ||
                            '—'
                          )}
                        </td>

                      </tr>

                    `
                  )
                  .join('')
              }

            </tbody>

          </table>

        </div>

      `;

    }


    /* ============================================================

    function telaIndicadorPreforma() {

    function telaUltimosTampas() {

              VERMELHO:
              OBSERVAÇÃO
              •
              EFICIÊNCIA &lt;
              ${numero(

    /* ============================================================
       TABELA PRÉ-FORMA / TAMPAS
       ============================================================ */

    function tabelaGenerica(
      registros,
      tipo
    ) {

      if (
        !registros ||
        registros.length === 0
      ) {

        return vazio(
          'Nenhum apontamento nas últimas 5 horas'
        );

      }


      const preforma =
        tipo === 'preforma';


      return `

        <div class="recent-wrap">

          <table class="recent-table">

            <thead>

              <tr>

                <th>Hora</th>

                <th>Turno</th>

                <th>Líder</th>

                ${
                  preforma
                    ?
                    '<th>Peças</th>'
                    :
                    '<th>Cor</th><th>Fardos</th>'
                }

                <th>Refugo</th>

                <th>Tempo perdido</th>

                <th>Observação</th>

              </tr>

            </thead>


            <tbody>

              ${
                registros
                  .map(
                    r => `

                      <tr
                        class="
                          ${
                            r.alerta
                              ? 'alert'
                              : ''
                          }
                        "
                      >

                        <td>
                          ${escapeHtml(r.hora)}
                        </td>

                        <td>
                          ${escapeHtml(r.turno)}
                        </td>

                        <td>
                          ${escapeHtml(r.lider)}
                        </td>

                        ${
                          preforma
                            ?
                            `
                              <td>
                                <strong>
                                  ${numero(r.pecas,0)}
                                </strong>
                              </td>
                            `
                            :
                            `
                              <td>
                                ${escapeHtml(r.cor)}
                              </td>

                              <td>
                                <strong>
                                  ${numero(r.fardos,0)}
                                </strong>
                              </td>
                            `
                        }

                        <td>
                          ${numero(r.refugo,0)}
                        </td>

                        <td>
                          ${escapeHtml(
                            r.tempoPerdido ||
                            '—'
                          )}
                        </td>

                        <td class="obs">
                          ${escapeHtml(
                            r.observacao ||
                            '—'
                          )}
                        </td>

                      </tr>

                    `
                  )
                  .join('')
              }

            </tbody>

          </table>

        </div>

      `;

    }


    /* ============================================================
       META
       ============================================================ */

    function metaDisplay(
      item
    ) {

      if (
        item.metaVariavel &&
        item.metaMin !== null &&
        item.metaMax !== null &&
        item.metaMin !==
        item.metaMax
      ) {

        return (
          numero(
            item.metaMin,
            0
          ) +
          '–' +
          numero(
            item.metaMax,
            0
          )
        );

      }


      return item.meta === null
        ? '—'
        :
        numero(
          item.meta,
          Number.isInteger(
            Number(item.meta)
          )
            ? 0
            : 1
        );

    }


    /* ============================================================
       CORES
       ============================================================ */

    function classeEficiencia(
      eficiencia,
      limite
    ) {

      if (
        eficiencia === null ||
        eficiencia === undefined
      ) {

        return '';

      }


      return Number(eficiencia) >=
        Number(limite)
          ? 'good'
          : 'bad';

    }


    function classeRefugo(
      refugoPct,
      refugo
    ) {

      if (
        refugoPct === null ||
        refugoPct === undefined
      ) {

        return Number(refugo) > 0
          ? 'bad'
          : '';

      }


      return Number(refugoPct) <
        Number(dados.metaRefugo)
          ? 'good'
          : 'bad';

    }


    function textoRefugo(
      refugoPct,
      refugo
    ) {

      if (
        refugoPct === null ||
        refugoPct === undefined
      ) {

        return Number(refugo) > 0
          ? 'N/D'
          : '—';

      }


      return numero(
        refugoPct,
        2
      ) + '%';

    }


    /* ============================================================
       STATUS
       ============================================================ */

    function statusPill(
      status
    ) {

      if (
        status === 'OK'
      ) {

        return `

          <span
            class="
              status-pill
              status-ok
            "
          >
            ● OK
          </span>

        `;

      }


      if (
        status === 'ALERTA'
      ) {

        return `

          <span
            class="
              status-pill
              status-alert
            "
          >
            ● ALERTA
          </span>

        `;

      }


      return `

        <span
          class="
            status-pill
            status-none
          "
        >
          SEM DADOS
        </span>

      `;

    }


    /* ============================================================
       ROTAÇÃO
       ============================================================ */

    function controlarRotacao() {

      if (!dados) {

        return;

      }


      const faltam =
        Math.max(
          0,
          Math.ceil(
            (
              nextChange -
              Date.now()
            ) /
            1000
          )
        );


      document
        .getElementById(
          'timer'
        )
        .textContent =
          'Próxima tela em ' +
          faltam +
          's';


      if (
        Date.now() >=
        nextChange
      ) {

        mostrarTela(
          currentScreen + 1
        );

      }

    }


    function mostrarTela(
      indice,
      resetTimer = true
    ) {

      currentScreen =
        (
          indice +
          SCREENS.length
        ) %
        SCREENS.length;


      document
        .querySelectorAll(
          '.screen'
        )
        .forEach(
          tela =>
            tela.classList
              .remove(
                'active'
              )
        );


      const alvo =
        document.getElementById(
          SCREENS[
            currentScreen
          ].id
        );


      if (alvo) {

        alvo.classList
          .add(
            'active'
          );

      }


      document
        .getElementById(
          'screen-name'
        )
        .textContent =
          SCREENS[
            currentScreen
          ].name;


      atualizarDots();


      if (resetTimer) {

        nextChange =
          Date.now() +
          SCREEN_INTERVAL;

      }

    }


    /* ============================================================
       DOTS
       ============================================================ */

    function criarDots() {

      document
        .getElementById(
          'dots'
        )
        .innerHTML =
          SCREENS
            .map(
              () =>
                '<span class="dot"></span>'
            )
            .join('');

    }


    function atualizarDots() {

      document
        .querySelectorAll(
          '.dot'
        )
        .forEach(
          (
            dot,
            i
          ) => {

            dot.classList
              .toggle(
                'active',
                i ===
                currentScreen
              );

          }
        );

    }


    /* ============================================================
       OUTROS
       ============================================================ */

    function vazio(
      mensagem
    ) {

      return `

        <div class="empty">

          ${escapeHtml(mensagem)}

        </div>

      `;

    }


    function numero(
      valor,
      casas
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ''
      ) {

        return '—';

      }


      const n =
        Number(valor);


      if (
        Number.isNaN(n)
      ) {

        return '—';

      }


      return n.toLocaleString(
        'pt-BR',
        {

          minimumFractionDigits:
            casas,

          maximumFractionDigits:
            casas

        }
      );

    }


    function escapeHtml(
      valor
    ) {

      const div =
        document.createElement(
          'div'
        );


      div.textContent =
        valor === null ||
        valor === undefined
          ? ''
          : String(valor);


      return div.innerHTML;

    }

  </script>

</body>
